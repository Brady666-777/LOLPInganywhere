name: Build Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - 'Resources/**'
      - 'scripts/build-windows.ps1'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'Resources/**'
      - 'scripts/build-windows.ps1'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - run: python -m pip install -r windows/requirements.txt
      - name: Test and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LoLPing-Windows-x64
          path: dist/LoLPing-Windows-x64.zip
          if-no-files-found: error
